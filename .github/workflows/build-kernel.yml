name: Build santos10 Kernel (x86)

on:
  push:
    branches:
      - cm-14.1
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Compiler to use'
        required: true
        default: 'aosp-4.9'
        type: choice
        options:
          - aosp-4.9
          - gcc-10
          - gcc-11
          - gcc-12
      defconfig:
        description: 'Kernel defconfig'
        required: true
        default: 'lineage_santos10_defconfig'
        type: string

jobs:
  build:
    name: Build Kernel (${{ github.event.inputs.compiler || 'aosp-4.9' }})
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential             gcc-multilib             g++-multilib             lib32z1-dev             libncurses5-dev             libssl-dev             bison             flex             libelf-dev             bc             ccache             zip             unzip

      - name: Setup Compiler
        id: setup-cc
        run: |
          COMPILER="${{ github.event.inputs.compiler || 'aosp-4.9' }}"
          echo "Selected compiler: $COMPILER"

          if [ "$COMPILER" = "aosp-4.9" ]; then
            echo "Cloning official LineageOS GCC 4.9 toolchain..."
            git clone --depth 1 -b cm-14.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_x86_x86_64-linux-android-4.9.git $GITHUB_WORKSPACE/toolchain
            echo "CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/x86_64-linux-android-" >> $GITHUB_ENV
            echo "MAKE_FLAGS=CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/x86_64-linux-android- HOSTCFLAGS=-fcommon" >> $GITHUB_ENV
          elif [ "$COMPILER" = "gcc-10" ]; then
            sudo apt-get install -y gcc-10 gcc-10-multilib g++-10-multilib
            echo "MAKE_FLAGS=CC=gcc-10 HOSTCC=gcc-10 HOSTCFLAGS=-fcommon" >> $GITHUB_ENV
          elif [ "$COMPILER" = "gcc-11" ]; then
            sudo apt-get install -y gcc-11 gcc-11-multilib g++-11-multilib
            echo "MAKE_FLAGS=CC=gcc-11 HOSTCC=gcc-11 HOSTCFLAGS=-fcommon" >> $GITHUB_ENV
          elif [ "$COMPILER" = "gcc-12" ]; then
            sudo apt-get install -y gcc-12 gcc-12-multilib g++-12-multilib
            echo "MAKE_FLAGS=CC=gcc-12 HOSTCC=gcc-12 HOSTCFLAGS=-fcommon" >> $GITHUB_ENV
          fi

      - name: Configure Kernel
        run: |
          DEFCONFIG="${{ github.event.inputs.defconfig || 'lineage_santos10_defconfig' }}"
          echo "Configuring kernel with $DEFCONFIG..."
          make ARCH=x86 $MAKE_FLAGS $DEFCONFIG

      - name: Build Kernel (bzImage)
        run: |
          set -o pipefail
          echo "Starting kernel compilation with $MAKE_FLAGS..."
          make -j$(nproc) ARCH=x86 $MAKE_FLAGS bzImage 2>&1 | tee build.log

      - name: Package Build Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f arch/x86/boot/bzImage ]; then
            cp arch/x86/boot/bzImage artifacts/bzImage
            echo "SUCCESS: Kernel bzImage built successfully!"
            ls -lh artifacts/bzImage
          else
            echo "ERROR: arch/x86/boot/bzImage was not generated!"
          fi
          if [ -f .config ]; then
            cp .config artifacts/kernel.config
          fi
          if [ -f build.log ]; then
            cp build.log artifacts/build.log
          fi
          if [ ! -f arch/x86/boot/bzImage ]; then
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: santos10-kernel-${{ github.event.inputs.compiler || 'aosp-4.9' }}-${{ github.run_number }}
          path: artifacts/
